name: CI/CD Pipeline - Backend & Frontend

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ----------------------------------------------------
  # BACKEND JOB
  # ----------------------------------------------------
  build-backend:
    name: Build & Publish Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js (v12)
        uses: actions/setup-node@v4
        with:
          node-version: 12

      - name: Cache npm global cache (Backend)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-backend-npm-${{ hashFiles('back/package.json') }}
          restore-keys: |
            ${{ runner.os }}-backend-npm-

      - name: Install dependencies & Test
        run: |
          cd back
          npm install
          npm test --if-present

      - name: Extract Short SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./back
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sfeirschool-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/sfeirschool-backend:${{ steps.vars.outputs.short_sha }}

  # ----------------------------------------------------
  # FRONTEND JOB
  # ----------------------------------------------------
  build-frontend:
    name: Build & Publish Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js (v10)
        uses: actions/setup-node@v4
        with:
          node-version: 10

      - name: Cache npm global cache (Frontend)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-frontend-npm-${{ hashFiles('front/package.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-npm-

      - name: Install dependencies & Build
        run: |
          cd front
          npm install
          npm run build --prod --if-present

      - name: Extract Short SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./front
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sfeirschool-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/sfeirschool-frontend:${{ steps.vars.outputs.short_sha }}

  # ----------------------------------------------------
  # GITHUB RELEASE JOB
  # ----------------------------------------------------
  create-release:
    name: Create GitHub Release
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Short SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ steps.vars.outputs.short_sha }}
          name: Release ${{ steps.vars.outputs.short_sha }}
          body: |
            Automated deployment for backend and frontend.
            Images pushed to Docker Hub with tag: `${{ steps.vars.outputs.short_sha }}`
          draft: false
          prerelease: false
